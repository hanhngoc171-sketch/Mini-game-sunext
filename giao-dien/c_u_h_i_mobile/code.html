<body class="bg-app-bg text-on-surface font-body-md min-h-screen flex flex-col overflow-x-hidden">

<div class="flex flex-col">

</div>
<div class="flex items-center gap-sm">
<div class="bg-surface-container-high px-sm py-xs rounded-full flex items-center gap-xs">

</div>

</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center px-sm pt-sm pb-xl max-w-lg mx-auto w-full">
<!-- Header Progress & Question Number -->
<div class="w-full flex justify-between items-end mb-md">
<div class="flex flex-col">
<span class="text-on-surface-variant font-label-md text-label-md uppercase tracking-wider">Tiến trình</span>

</div>
<div class="text-right">
<span class="text-on-surface-variant font-label-md text-label-md">Đúng liên tiếp: 2 🔥</span>
</div>
</div>
<!-- Progress Bar -->
<div class="w-full h-2 bg-surface-container-highest rounded-full mb-lg overflow-hidden">
<div class="h-full bg-success-green transition-all duration-1000 ease-linear" id="progress-timer" style="width: 100%;"></div>
</div>
<!-- Timer Circle -->
<div class="relative mb-lg">
<div class="w-24 h-24 rounded-full border-4 border-primary flex items-center justify-center bg-surface-white timer-glow" id="timer-container">
<span class="font-display-lg-mobile text-display-lg-mobile text-primary" id="timer-text">15</span>
</div>
</div>
<!-- Question Card -->
<div class="w-full bg-surface-white rounded-xl p-md shadow-sm mb-lg border border-outline-variant/30">
<h2 class="font-headline-sm text-headline-sm text-center text-on-surface leading-tight">
                Đâu là giá trị cốt lõi của công ty?
            </h2>
</div>
<!-- Answer Buttons - Single Column Mobile -->
<div class="w-full space-y-sm">
<!-- Answer A -->
<button class="w-full min-h-[64px] flex items-center px-md py-sm bg-success-green text-white rounded-xl shadow-sm transition-all active:scale-98 group" onclick="selectAnswer(this)">
<div class="w-10 h-10 rounded-lg bg-white/20 flex items-center justify-center mr-md shrink-0">
<span class="font-headline-sm text-headline-sm">A</span>
</div>
<span class="font-label-lg text-label-lg text-left">Sáng tạo</span>
</button>
<!-- Answer B -->

</button>

</div>

</a>

<script>
        let timeLeft = 15;
        const timerText = document.getElementById('timer-text');
        const progressBar = document.getElementById('progress-timer');
        const timerContainer = document.getElementById('timer-container');

        const countdown = setInterval(() => {
            timeLeft--;
            timerText.innerText = timeLeft;
            
            // Update progress bar
            const percent = (timeLeft / 15) * 100;
            progressBar.style.width = percent + '%';

            // Visual warnings
            if (timeLeft <= 5) {
                progressBar.classList.remove('bg-success-green');
                progressBar.classList.add('bg-secondary-container');
                timerText.classList.replace('text-primary', 'text-secondary');
                timerContainer.classList.replace('border-primary', 'border-secondary-container');
            }
            
            if (timeLeft <= 2) {
                progressBar.classList.replace('bg-secondary-container', 'bg-error-red');
                timerText.classList.replace('text-secondary', 'text-error-red');
                timerContainer.classList.replace('border-secondary-container', 'border-error-red');
                timerContainer.classList.add('pulse-urgent');
            }

            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerText.innerText = '0';
                // Trigger timeout logic here
            }
        }, 1000);

        function selectAnswer(btn) {
            // Remove selection from all others
            document.querySelectorAll('button').forEach(b => b.classList.remove('active-selection'));
            // Add to clicked
            btn.classList.add('active-selection');
            
            // Subtle feedback
            if (navigator.vibrate) {
                navigator.vibrate(10);
            }
        }
    </script>
