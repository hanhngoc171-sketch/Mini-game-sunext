<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-bounce-slow {
            animation: bounce-slow 2s ease-in-out infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }
        .pulse-ring {
            animation: pulse-ring 3s ease-in-out infinite;
        }
        
        /* Skeleton loading style pulses */
        .skeleton-shimmer {
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-soft-cream min-h-screen flex flex-col font-body-md overflow-hidden text-on-surface">
<!-- Top Status Bar (System-like) -->
<header class="flex justify-between items-center px-sm py-xs w-full z-10">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-success-green" style="font-variation-settings: 'FILL' 1;">wifi</span>
<span class="font-label-md text-label-md text-success-green">Kết nối: Tốt</span>
</div>
<div class="bg-primary-container/20 px-sm py-1 rounded-full flex items-center gap-xs">
<span class="material-symbols-outlined text-primary text-[18px]" style="font-variation-settings: 'FILL' 1;">group</span>
<span class="font-label-md text-label-md text-primary font-bold">42/60</span>
</div>
</header>
<!-- Main Canvas Area -->
<main class="flex-grow flex flex-col items-center justify-center px-md text-center relative">
<!-- Abstract Background Shape for Focus -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-20">
<div class="w-[80vw] h-[80vw] bg-white rounded-full pulse-ring blur-3xl"></div>
</div>
<!-- Identity Section -->
<div class="relative z-10 mb-lg">
<div class="w-24 h-24 bg-surface-white rounded-xl shadow-lg flex items-center justify-center mx-auto mb-sm border-2 border-primary-container">
<span class="material-symbols-outlined text-primary text-[48px]" style="font-variation-settings: 'FILL' 1;">person</span>
</div>
<h1 class="font-headline-sm text-headline-sm text-primary mb-xs">Minh Anh</h1>
<div class="bg-primary/5 px-sm py-1 rounded-full inline-block">
<p class="font-label-md text-label-md text-on-surface-variant">Sẵn sàng thi đấu!</p>
</div>
</div>
<!-- PIN Display -->
<div class="relative z-10 mb-lg w-full max-w-xs">
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest mb-xs">Mã phòng</p>
<div class="bg-surface-white rounded-xl shadow-sm border border-outline-variant p-md flex flex-col items-center justify-center gap-xs">
<span class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-[0.2em] font-bold">882 041</span>
<div class="w-full h-1 bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-secondary-container w-3/4 skeleton-shimmer"></div>
</div>
</div>
</div>
<!-- Waiting Indicator -->
<div class="relative z-10 flex flex-col items-center gap-md">
<div class="relative w-20 h-20 flex items-center justify-center">
<div class="absolute inset-0 border-4 border-primary/10 rounded-full"></div>
<div class="absolute inset-0 border-4 border-transparent border-t-secondary-container rounded-full animate-spin"></div>
<span class="material-symbols-outlined text-secondary-container text-[32px] animate-bounce-slow">sports_esports</span>
</div>
<div class="space-y-xs">
<p class="font-headline-sm text-headline-sm text-on-surface animate-pulse">Đang chờ người tổ chức bắt đầu</p>
<p class="font-body-md text-body-md text-on-surface-variant px-md">Hãy chuẩn bị kiến thức để giành ngôi quán quân nhé!</p>
</div>
</div>
</main>
<!-- Bottom Decorative / Info Section -->
<footer class="w-full px-md pb-lg pt-sm z-10">
<div class="bg-surface-white/60 backdrop-blur-md rounded-xl p-sm flex items-center justify-between border border-white/40 shadow-sm">
<div class="flex items-center gap-sm">
<div class="w-10 h-10 bg-secondary rounded-lg flex items-center justify-center text-on-secondary">
<span class="material-symbols-outlined">quiz</span>
</div>
<div class="text-left">
<p class="font-label-md text-label-md font-bold text-on-surface">Quiz Định Kỳ T10</p>
<p class="font-label-md text-label-md text-on-surface-variant opacity-70">Company HQ</p>
</div>
</div>
<button class="bg-surface-container-high p-xs rounded-lg active:scale-90 transition-transform">
<span class="material-symbols-outlined text-on-surface-variant">info</span>
</button>
</div>
</footer>
<!-- Micro-interaction overlay script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Subtle random vibration for energetic feel occasionally
            const indicator = document.querySelector('.animate-bounce-slow');
            setInterval(() => {
                if(Math.random() > 0.8) {
                    indicator.classList.add('scale-110');
                    setTimeout(() => indicator.classList.remove('scale-110'), 200);
                }
            }, 3000);
        });
    </script>
</body></html>
