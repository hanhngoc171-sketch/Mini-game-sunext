<!-- Navigation Shell (BottomNavBar Context) -->
<!-- Suppressed as per Task-Focused screen rules -->
<script>
        // Simple countdown logic for the progress bar
        let timeLeft = 100;
        const progressBar = document.getElementById('progress-bar');
        const interval = setInterval(() => {
            timeLeft -= 2;
            if (progressBar) {
                progressBar.style.width = timeLeft + '%';
            }
            if (timeLeft <= 0) {
                clearInterval(interval);
            }
        }, 100);

        // Particle confetti for success
        function createConfetti() {
            const colors = ['#2E7D32', '#fc7d05', '#FFF4A4', '#386641'];
            const container = document.body;
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.style.position = 'absolute';
                confetti.style.width = Math.random() * 10 + 5 + 'px';
                confetti.style.height = Math.random() * 10 + 5 + 'px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-10px';
                confetti.style.zIndex = '5';
                confetti.style.borderRadius = '2px';
                confetti.style.opacity = Math.random();
                container.appendChild(confetti);

                const animation = confetti.animate([
                    { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
                    { transform: `translateY(100vh) rotate(${Math.random() * 360}deg)`, opacity: 0 }
                ], {
                    duration: Math.random() * 2000 + 3000,
                    easing: 'cubic-bezier(0, .9, .57, 1)'
                });

                animation.onfinish = () => confetti.remove();
            }
        }
        
        // Trigger confetti on load
        window.addEventListener('DOMContentLoaded', createConfetti);
    </script>
