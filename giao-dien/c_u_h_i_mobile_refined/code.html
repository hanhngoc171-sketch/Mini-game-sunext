                    "error-red": "#D92D20",
                    "tertiary-fixed": "#ffdf9c",
                    "error": "#ba1a1a",
                    "on-tertiary-container": "#fcd069",
                    "on-error-container": "#93000a",

                    "primary-container": "#386641",
                    "on-secondary": "#ffffff",
                    "app-bg": "#F8FAF8",

                    "primary-fixed-dim": "#a0d3a5",
                    "on-error": "#ffffff",
                    "on-tertiary-fixed-variant": "#5b4300",
                    "tertiary-container": "#755800",
                    "on-primary-fixed": "#00210a",
                    "inverse-surface": "#2a332a",
                    "surface-bright": "#f2fcee",
                    "surface-variant": "#dbe5d8",
                    "surface-container-lowest": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",

                    "full": "9999px"

            "spacing": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .active-selection {
            outline: 4px solid #204e2b !important;
            transform: scale(0.98);
        }
        @keyframes countdown-pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .pulse-urgent {
            animation: countdown-pulse 0.5s infinite;
        }
        body {
            min-height: 100dvh;
        }
    </style>
</head>
<body class="bg-app-bg text-on-surface font-body-md flex flex-col overflow-x-hidden">
<!-- Top Navigation Bar -->
<header class="sticky top-0 w-full z-50 flex justify-between items-center px-md py-sm bg-surface-white border-b border-outline-variant/30 max-w-container-max mx-auto">
<div class="flex flex-col">
<span class="font-headline-sm text-headline-sm font-bold text-primary">Company Quiz</span>
</div>
<div class="flex items-center gap-sm">
<div class="bg-surface-container-high px-sm py-xs rounded-full flex items-center gap-xs">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">stars</span>
<span class="font-label-lg text-label-lg text-on-surface">1,240 pts</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">notifications</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center px-sm pt-sm pb-xl max-w-lg mx-auto w-full">
<!-- Header Progress & Question Number -->
<div class="w-full flex justify-between items-end mb-sm">
<div class="flex flex-col">
<span class="text-on-surface-variant font-label-md text-label-md uppercase tracking-wider">Tiến trình</span>
<h1 class="font-headline-md text-headline-md text-on-surface">Câu 3/10</h1>
</div>
<div class="text-right">
<span class="text-on-surface-variant font-label-md text-label-md">Đúng liên tiếp: 2 🔥</span>
</div>
</div>
<!-- Minimal Progress Bar -->
<div class="w-full h-1.5 bg-surface-container-highest rounded-full mb-md overflow-hidden">
<div class="h-full bg-success-green transition-all duration-1000 ease-linear" id="progress-timer" style="width: 100%;"></div>
</div>
<!-- Timer Circle -->
<div class="mb-md">
<div class="w-20 h-20 rounded-full border-[3px] border-primary flex items-center justify-center bg-white" id="timer-container">
<span class="font-headline-lg text-headline-lg text-primary" id="timer-text">15</span>
</div>
</div>
<!-- Question Card - High Contrast Typography -->
<div class="w-full bg-white rounded-xl p-md border border-outline-variant/20 mb-md">
<h2 class="font-headline-sm text-headline-sm text-center text-on-surface font-bold leading-tight">
            Đâu là giá trị cốt lõi của công ty?
        </h2>
</div>
<!-- Answer Buttons - Large and Full Width -->
<div class="w-full space-y-3">
<!-- Answer A - Green -->
<button class="w-full min-h-[64px] flex items-center px-md py-sm bg-primary text-white rounded-xl transition-all active:scale-[0.98]" onclick="selectAnswer(this)">
<div class="w-10 h-10 rounded-lg bg-white/20 flex items-center justify-center mr-md shrink-0">
<span class="font-headline-sm text-headline-sm">A</span>
</div>
<span class="font-label-lg text-label-lg text-left">Sáng tạo</span>
</button>
<!-- Answer B - Orange -->
<button class="w-full min-h-[64px] flex items-center px-md py-sm bg-secondary-container text-white rounded-xl transition-all active:scale-[0.98]" onclick="selectAnswer(this)">
<div class="w-10 h-10 rounded-lg bg-white/20 flex items-center justify-center mr-md shrink-0">
<span class="font-headline-sm text-headline-sm">B</span>
</div>
<span class="font-label-lg text-label-lg text-left">Chính trực</span>
</button>
<!-- Answer C - Brownish/Olive -->
<button class="w-full min-h-[64px] flex items-center px-md py-sm bg-tertiary-container text-white rounded-xl transition-all active:scale-[0.98]" onclick="selectAnswer(this)">
<div class="w-10 h-10 rounded-lg bg-white/20 flex items-center justify-center mr-md shrink-0">
<span class="font-headline-sm text-headline-sm">C</span>
</div>
<span class="font-label-lg text-label-lg text-left">Hợp tác</span>
</button>
<!-- Answer D - Yellow -->
<button class="w-full min-h-[64px] flex items-center px-md py-sm bg-tertiary-fixed text-on-tertiary-fixed rounded-xl transition-all active:scale-[0.98]" onclick="selectAnswer(this)">
<div class="w-10 h-10 rounded-lg bg-on-tertiary-fixed/10 flex items-center justify-center mr-md shrink-0">
<span class="font-headline-sm text-headline-sm">D</span>
</div>
<span class="font-label-lg text-label-lg text-left">Tất cả đáp án trên</span>
</button>
</div>
</main>
<!-- Bottom Navigation Bar (Mobile) -->
<nav class="md:hidden sticky bottom-0 left-0 w-full flex justify-around items-center px-4 py-2 pb-safe bg-surface-white border-t border-outline-variant/30 z-50">
<a class="flex flex-col items-center justify-center text-outline p-2 hover:text-primary transition-all active:scale-90" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-label-md text-label-md">Home</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl p-2 active:scale-95 transition-transform" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">apps</span>
<span class="font-label-md text-label-md">Join Game</span>
</a>
<a class="flex flex-col items-center justify-center text-outline p-2 hover:text-primary transition-all active:scale-90" href="#">
<span class="material-symbols-outlined">history</span>
<span class="font-label-md text-label-md">History</span>
</a>
<a class="flex flex-col items-center justify-center text-outline p-2 hover:text-primary transition-all active:scale-90" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-label-md text-label-md">Profile</span>
</a>
</nav>
<script>
    let timeLeft = 15;
    const timerText = document.getElementById('timer-text');
    const progressBar = document.getElementById('progress-timer');
    const timerContainer = document.getElementById('timer-container');

    const countdown = setInterval(() => {
        timeLeft--;
        timerText.innerText = timeLeft;
        
        // Update progress bar
        const percent = (timeLeft / 15) * 100;
        progressBar.style.width = percent + '%';

        // Visual warnings
        if (timeLeft <= 5) {
            progressBar.classList.remove('bg-success-green');
            progressBar.classList.add('bg-secondary-container');
            timerText.classList.replace('text-primary', 'text-secondary');
            timerContainer.classList.replace('border-primary', 'border-secondary-container');
        }
        
        if (timeLeft <= 2) {
            progressBar.classList.replace('bg-secondary-container', 'bg-error-red');
            timerText.classList.replace('text-secondary', 'text-error-red');
            timerContainer.classList.replace('border-secondary-container', 'border-error-red');
            timerContainer.classList.add('pulse-urgent');
        }

        if (timeLeft <= 0) {
            clearInterval(countdown);
            timerText.innerText = '0';
        }
    }, 1000);

    function selectAnswer(btn) {
        // Remove selection from all others
        document.querySelectorAll('button').forEach(b => b.classList.remove('active-selection'));
        // Add to clicked
        btn.classList.add('active-selection');
        
        // Subtle feedback
        if (navigator.vibrate) {
            navigator.vibrate(10);
        }
    }
</script>
</body></html>
