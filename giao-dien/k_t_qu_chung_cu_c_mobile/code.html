<script>
        // Micro-interactions and Confetti Effect
        function createConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#386641', '#984800', '#fc7d05', '#FFF4A4', '#204e2b'];
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                confetti.style.opacity = Math.random();
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                
                container.appendChild(confetti);
                
                // Cleanup
                setTimeout(() => {
                    confetti.remove();
                }, 5000);
            }
        }

        // Trigger confetti on load
        window.addEventListener('DOMContentLoaded', () => {
            createConfetti();
            // Burst again after a short delay for layering
            setTimeout(createConfetti, 1000);
        });

        // Interactive states for buttons (Tailwind handles most, but we can add haptic feedback simulation)
        const ctaBtn = document.querySelector('button');
        ctaBtn.addEventListener('touchstart', () => {
            if (window.navigator.vibrate) window.navigator.vibrate(10);
        });
    </script>
