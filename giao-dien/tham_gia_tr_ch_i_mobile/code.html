<script>
        // Micro-interaction: Focus on input on load
        window.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('roomPinInput');
            input.focus();
        });

        function handleJoin() {
            const input = document.getElementById('roomPinInput');
            const errorBox = document.getElementById('errorBox');
            
            // Basic demo validation logic: if input is empty or too short, show error
            if (input.value.length < 4) {
                errorBox.classList.remove('hidden');
                input.classList.add('border-error');
                input.classList.remove('border-primary');
                
                // Shake effect
                input.animate([
                    { transform: 'translateX(0)' },
                    { transform: 'translateX(-5px)' },
                    { transform: 'translateX(5px)' },
                    { transform: 'translateX(0)' }
                ], { duration: 200, iterations: 2 });
            } else {
                errorBox.classList.add('hidden');
                input.classList.remove('border-error');
                input.classList.add('border-primary');
                
                // Simulate loading
                const btn = document.querySelector('button');
                btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Đang kết nối...';
                btn.disabled = true;
                
                setTimeout(() => {
                    alert('Kết nối thành công tới phòng ' + input.value);
                    btn.innerHTML = 'Tham gia <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>';
                    btn.disabled = false;
                }, 1500);
            }
        }

        // Hide error when user starts typing
        document.getElementById('roomPinInput').addEventListener('input', () => {
            document.getElementById('errorBox').classList.add('hidden');
            document.getElementById('roomPinInput').classList.remove('border-error');
        });
    </script>
<!-- Visual Polish: Subtle Particle Effect Canvas (Atmospheric) -->
<canvas class="fixed inset-0 pointer-events-none -z-10" id="atmosphere"></canvas>
<script>
        const canvas = document.getElementById('atmosphere');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speed = Math.random() * 0.3 + 0.1;
                this.opacity = Math.random() * 0.3;
            }
            update() {
                this.y -= this.speed;
                if (this.y < 0) this.reset();
            }
            draw() {
                ctx.fillStyle = `rgba(32, 78, 43, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            resize();
            for (let i = 0; i < 30; i++) {
                particles.push(new Particle());
            }
            animate();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        init();
    </script>
